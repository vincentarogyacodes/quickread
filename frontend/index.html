<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickRead</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>QuickRead</h1>
        <p>Turn an article into something you can actually read.</p>
        <div class="input-area">
            <input id="url-input" type="text" placeholder="Paste an article URL">
            <button id="quick-read-button">Quick Read</button>
        </div>
        <p id="status"></p>
        <section>
            <h2>Your Summary</h2>
            <p id="summarized-text">You summary will appear here.</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
